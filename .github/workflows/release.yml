# Builds SwitchBoard, packages it as a Sparkle-compatible .zip, signs it
# with Sparkle's EdDSA key, regenerates appcast.xml, and publishes a GitHub
# Release - triggered by pushing a version tag (e.g. `v1.0.1`).
#
# ONE-TIME SETUP before this workflow can do anything useful:
#
#   1. Generate a Sparkle EdDSA signing key pair (needs the Sparkle CLI
#      tools - see the "Download Sparkle CLI tools" step below for how CI
#      fetches them; you can run the same `generate_keys` binary locally):
#        ./generate_keys
#      This prints the PUBLIC key - paste it into
#      KeySwitch/Info.plist's SUPublicEDKey (currently a placeholder; see
#      the comment there). It also stores the PRIVATE key in your login
#      Keychain.
#
#   2. Export the private key and add it as a repository secret named
#      SPARKLE_PRIVATE_KEY (Settings -> Secrets and variables -> Actions):
#        ./generate_keys -x /tmp/sparkle_private_key
#      Paste the contents of /tmp/sparkle_private_key as the secret value,
#      then delete that file. NEVER commit this key.
#
# KNOWN SIMPLIFICATION: this template regenerates appcast.xml from only the
# release currently being published, so the appcast always has exactly one
# <item> - anyone on an older version updates straight to latest, which is
# fine for most small apps but skips Sparkle's delta-update/rollback
# support. To publish a full version history instead, download previous
# releases' .zip assets into `appcast_archives/` before the
# `generate_appcast` step (see Sparkle's own release-notes generation docs).
#
# SIGNING: builds are signed with a self-signed "SwitchBoard Release
# Signing" certificate (generated 2026-09-17), NOT ad-hoc
# (CODE_SIGN_IDENTITY="-") and NOT a paid Apple Developer ID. This matters
# specifically for Sparkle: Sparkle refuses to install an update unless the
# new build's code signature was made with the *same certificate* as the
# currently-running app's. Ad-hoc signing has no real certificate - Xcode
# generates a fresh identity pinned to that exact build's content hash
# every time - so two separately-built ad-hoc releases can NEVER satisfy
# that check, and auto-update fails 100% of the time (confirmed via
# Console: "Code signature of the new version doesn't match the old
# version"). A self-signed cert reused across every release produces a
# stable designated requirement (`certificate leaf = H"<cert hash>"`
# instead of `cdhash H"<build hash>"`), which Sparkle accepts as "same
# certificate" release after release - free, at the cost of Gatekeeper
# still showing the "unidentified developer" prompt on first launch (same
# as ad-hoc already did - see build_and_package.sh). If you later get a
# paid Developer ID, switch CODE_SIGN_IDENTITY to that and add a
# notarization step (xcrun notarytool) instead of this cert.
#
# One-time setup:
#   1. Generate the cert once (already done for this repo; skip if the
#      identity below already exists in your keychain):
#        openssl req -x509 -newkey rsa:2048 -days 7300 -nodes \
#          -subj "/CN=SwitchBoard Release Signing" \
#          -keyout sb_signing.key -out sb_signing.crt \
#          -addext "keyUsage=digitalSignature" \
#          -addext "extendedKeyUsage=codeSigning"
#   2. Bundle it for CI and set a throwaway export password:
#        openssl pkcs12 -export -inkey sb_signing.key -in sb_signing.crt \
#          -out sb_signing.p12 -name "SwitchBoard Release Signing" \
#          -passout pass:<PASSWORD>
#   3. Add two repository secrets (Settings -> Secrets and variables ->
#      Actions): MACOS_SIGNING_CERT_P12 = `base64 -i sb_signing.p12`,
#      and MACOS_SIGNING_CERT_PASSWORD = <PASSWORD>. Then delete the local
#      .key/.crt/.p12 files - only the keychain copy is needed after this.
#
# NOTE ON THE FIRST CERT-SIGNED RELEASE: anyone already running an
# ad-hoc-signed build (every release through v2.1.4) will hit this exact
# same "signature doesn't match" wall trying to auto-update to the first
# cert-signed release, since ad-hoc -> certificate is still a signing
# identity change. That one jump needs a manual reinstall from the
# release page; every release after that updates via Sparkle normally.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  SCHEME: KeySwitch
  APP_NAME: SwitchBoard
  CONFIGURATION: Release
  # Keep this in sync with the Sparkle SPM dependency's resolved version
  # (see KeySwitch.xcodeproj -> Sparkle package requirement) so the CLI
  # tools match what's linked into the app.
  SPARKLE_VERSION: "2.10.0"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        # This project's .xcodeproj was last saved by Xcode 26.1.1
        # (objectVersion 77) - older Xcode can't even parse the file
        # ("future Xcode project file format"), so we can't just take
        # the runner's default. macos-15 runner images ship 26.1.1
        # alongside their default at /Applications/Xcode_26.1.1.app -
        # bump this if the project file format is ever upgraded further.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project KeySwitch.xcodeproj \
            -scheme "${SCHEME}"

      - name: Import code-signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERT_P12 / MACOS_SIGNING_CERT_PASSWORD secrets are not set - see the SIGNING setup comment at the top of this workflow file."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Build (signed with SwitchBoard Release Signing cert, universal)
        run: |
          rm -rf build
          xcodebuild \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            clean build \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="SwitchBoard Release Signing" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Locate built app and create zip
        id: package
        run: |
          APP_PATH=$(find build -name "${APP_NAME}.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find ${APP_NAME}.app under build/"
            exit 1
          fi
          ZIP_NAME="${APP_NAME}-${{ steps.version.outputs.marketing_version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download Sparkle CLI tools
        run: |
          curl -fsSL -o sparkle-tools.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle-tools.tar.xz -C sparkle-tools
          echo "$(pwd)/sparkle-tools/bin" >> "$GITHUB_PATH"

      - name: Generate signed appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set - see the setup comment at the top of this workflow file."
            exit 1
          fi
          mkdir -p appcast_archives
          cp "${{ steps.package.outputs.zip_name }}" appcast_archives/

          generate_appcast \
            --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY") \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            appcast_archives

          cp appcast_archives/appcast.xml appcast.xml

      - name: Commit appcast.xml to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --staged --quiet || git commit -m "Update appcast.xml for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_name }}
